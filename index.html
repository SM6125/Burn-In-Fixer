<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Burn-in Fixer</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
                background-color: #000;
                color: #eee;
            }
            .center {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 12px;
            }
            .card {
                padding: 24px;
                border-radius: 8px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
                text-align: center;
            }
            input[type="number"] {
                width: 80px;
                padding: 6px;
                border-radius: 4px;
                border: 1px solid #eee;
                background-color: #000;
                color: #eee;
            }
            button {
                padding: 10px 18px;
                border-radius: 6px;
                border: none;
                background: #0078d4;
                color: #eee;
                font-size: 16px;
                cursor: pointer;
            }
            .hint {
                font-size: 14px;
                color: #eee;
            }
            .hidden {
                display: none !important;
            }
            .hide-cursor {
                cursor: none !important;
            }
        </style>
    </head>
    <body>
        <div id="startScreen" class="center">
            <div class="card">
                <h1>Burn-in Fixer</h1>
                <div style="margin-top: 12px">
                    <button id="startBtn">Start</button>
                </div>
                <p class="hint" style="margin-top: 12px">
                    Press any key to stop and return to this screen.<br />
                    Adjust the screen brightness, and turn off Night Light for better results.<br />
                    Don't look at the flashing screen directly as it can hurt your eyes.
                </p>
            </div>
        </div>

        <script>
            (function () {
                const colors = ["#f00", "#0f0", "#00f", "#fff", "#000"]; // Change colors here
                const secs = 0.5; // Change interval here
                const startBtn = document.getElementById("startBtn");
                const startScreen = document.getElementById("startScreen");
                let intervalId = null;
                let colorIndex = 0;
                let running = false;

                function setBg(color) {
                    document.documentElement.style.background = color;
                    document.body.style.background = color;
                }

                function startCycle() {
                    const ms = Math.round(secs * 1000);
                    running = true;
                    startScreen.classList.add("hidden");
                    document.body.classList.add("hide-cursor");
                    colorIndex = 0;
                    setBg(colors[colorIndex]);
                    intervalId = setInterval(() => {
                        colorIndex = (colorIndex + 1) % colors.length;
                        setBg(colors[colorIndex]);
                    }, ms);
                }

                function stopCycle() {
                    if (!running) return;
                    running = false;
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                    }
                    document.body.classList.remove("hide-cursor");
                    setBg("");
                    startScreen.classList.remove("hidden");
                }

                startBtn.addEventListener("click", async () => {
                    try {
                        await document.documentElement.requestFullscreen();
                        startCycle();
                    } catch (e) {
                        alert("Setting fullscreen mode failed. Please check your browser settings.");
                    }
                });

                window.addEventListener(
                    "keydown",
                    (ev) => {
                        if (running) {
                            ev.preventDefault();
                            stopCycle();
                        }
                    },
                    { capture: true }
                );

                document.addEventListener("fullscreenchange", () => {
                    if (running && !document.fullscreenElement) {
                        if (intervalId) {
                            clearInterval(intervalId);
                            intervalId = null;
                        }
                        running = false;
                        setBg("");
                        startScreen.classList.remove("hidden");
                    }
                });
            })();
        </script>
    </body>
</html>
